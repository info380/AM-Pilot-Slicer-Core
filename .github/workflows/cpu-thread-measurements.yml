name: Native CPU and thread measurements (manual)
run-name: Native CPU ${{ inputs.engine }} / ${{ inputs.fixture }} (${{ inputs.profile }})
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Full balanced repeats or a short harness smoke check
        required: true
        default: full
        type: choice
        options: [full, smoke, seam-prototype]
      engine:
        description: Engine for this independent comparison
        required: true
        default: bambu
        type: choice
        options: [bambu, prusa]
      fixture:
        description: Workload for this independent comparison
        required: true
        default: linked-ten
        type: choice
        options: [linked-ten, unique-ten, single-dense]
permissions:
  contents: read
concurrency:
  group: native-cpu-thread-measurements-${{ inputs.engine }}-${{ inputs.fixture }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/main' && inputs.profile != 'seam-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Verify the exact reviewed worker image signature
        run: |
          node qualification/cpu-scaling/run.mjs validate "$PROFILE" unused "$ENGINE" "$FIXTURE"
          image="$(node -p "require('./qualification/cpu-scaling/plan.json').image")"
          tag="$(node -p "require('./qualification/cpu-scaling/plan.json').releaseTag")"
          cosign verify --certificate-identity "https://github.com/info380/AM-Pilot-Slicer-Core/.github/workflows/release-bambu.yml@refs/tags/${tag}" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" > /tmp/cpu-scaling-signature.json
        env:
          PROFILE: ${{ inputs.profile }}
          ENGINE: ${{ inputs.engine }}
          FIXTURE: ${{ inputs.fixture }}
      - name: Measure sequential native Linux cases without production access
        run: node qualification/cpu-scaling/run.mjs run "$PROFILE" "$RUNNER_TEMP/cpu-scaling-evidence" "$ENGINE" "$FIXTURE"
        env:
          PROFILE: ${{ inputs.profile }}
          ENGINE: ${{ inputs.engine }}
          FIXTURE: ${{ inputs.fixture }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-cpu-thread-evidence-${{ inputs.engine }}-${{ inputs.fixture }}
          path: |
            ${{ runner.temp }}/cpu-scaling-evidence/report.json
            /tmp/cpu-scaling-signature.json
          if-no-files-found: error
          retention-days: 7

  seam-visibility-prototype:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'seam-prototype'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
      - name: Install official native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake pkg-config git gettext autoconf libgtk-3-dev libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglu1-mesa-dev libosmesa6-dev libglew-dev libdbus-1-dev libsecret-1-dev libudev-dev libunwind-dev libssl-dev libcurl4-openssl-dev libmspack-dev libbz2-dev libfontconfig1-dev libpango1.0-dev
      - name: Build matched native control and seam-visibility candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash native/bambu/build-prototype.sh "$RUNNER_TEMP/bambu-native-work" "$RUNNER_TEMP/bambu-native-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bambu-seam-prototype-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bambu-native-output/*.log
            ${{ runner.temp }}/bambu-native-output/*.txt
            ${{ runner.temp }}/bambu-native-output/*.json
            ${{ runner.temp }}/bambu-native-output/*.patch
            ${{ runner.temp }}/bambu-native-output/native-prototype.tar.gz*
          if-no-files-found: error
          retention-days: 7
